<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PriceOja</title>
<style>
body{background:#f4f6f4;font-family:Arial;margin:0}
header{background:#0A7A42;color:#fff;padding:16px;text-align:center}
header span{color:#FF8A00}
.s{padding:10px;background:#fff}
.s input{width:100%;padding:12px;border:2px solid #0A7A42;border-radius:20px}
.c{display:flex;gap:6px;overflow:auto;padding:10px;background:#fff}
.c button{border:1px solid #0A7A42;background:#fff;color:#0A7A42;padding:8px 14px;border-radius:20px}
.c button.on{background:#0A7A42;color:#fff}
.v{background:#fff;margin:10px;border:2px solid #FF8A00;border-radius:12px;padding:12px}
.v a{display:inline-block;padding:10px 14px;border-radius:8px;color:#fff;text-decoration:none;margin:4px 4px 0 0;font-weight:700}
.call{background:#0A7A42}
.wa{background:#25D366}
.code{background:#FFF0D9;border:1px dashed #FF8A00;padding:8px;text-align:center;margin-top:8px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:#fff;border-radius:12px;overflow:hidden}
.card img{width:100%;height:130px;object-fit:cover}
.b{padding:10px}
.b h3{font-size:13px}
.pr{font-weight:900;color:#0A7A42;font-size:17px}
.mk{font-size:11px;color:#666}
.card button{width:100%;padding:9px;border:0;border-radius:8px;font-weight:700;margin-top:6px;color:#fff}
.o{background:#25D366}
.n{background:#FF8A00}
</style>
</head>
<body>
<header>
<h1>Price<span>Oja</span> 🛒</h1>
<p>Know Price Before You Go Market • Lagos</p>
</header>
<div class="s">
<input id="q" placeholder="Search Polo, Jeans, Jewelry..." oninput="show()">
</div>
<div class="c">
<button class="on" onclick="cat('All',this)">All</button>
<button onclick="cat('Clothes',this)">Clothes</button>
<button onclick="cat('Jewelry',this)">Jewelry</button>
<button onclick="cat('Wristwatches',this)">Watches</button>
<button onclick="cat('Interior Decoration',this)">Decor</button>
<button onclick="cat('Food',this)">Food</button>
</div>
<div class="v">
<h2>Oak Clothing ✓ Verified</h2>
<p>Lagos • Polo Ralph, T-Shirt, Jeans • ⭐ 4.8</p>
<a class="call" href="tel:+2348104966033">Call Oak</a>
<a class="wa" href="https://wa.me/2348104966033?text=Hello Oak, I saw you on PriceOja">WhatsApp Oak</a>
<div class="code">Mention <b>PRICEOJA</b> to Oak for discount</div>
</div>
<div class="g" id="g"></div>
